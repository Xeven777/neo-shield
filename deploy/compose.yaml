name: neoshield

# NeoShield runs as two independent applications (web + worker) sharing one
# PostgreSQL database. Choose your deployment mode:
#
#   1) Neon (managed) — default, no postgres service. Set DATABASE_URL /
#      NEOSHIELD_DATABASE_URL to your Neon connection string in deploy/.env.
#   2) Local PostgreSQL — run with `--profile local-db`. A postgres service is
#      added, and the DB URLs default to postgresql://postgres:password@postgres:5432/neoshield
#      (override these in deploy/.env if you use a custom user/db/port).
#
#   To start with Neon:            docker compose up
#   To start with local Postgres:  docker compose --profile local-db up

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: neoshield-web:latest
    env_file: .env
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - neoshield
    healthcheck:
      test:
        [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ../neoshield-python
      dockerfile: Dockerfile
    image: neoshield-worker:latest
    env_file: .env
    environment:
      NEOSHIELD_WEB_URL: http://web:3000
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      - neoshield
    healthcheck:
      test:
        [ "CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - neoshield
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neoshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:

networks:
  neoshield:
    driver: bridge
