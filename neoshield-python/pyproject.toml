[project]
name = "neoshield-python"
version = "0.1.0"
description = "NeoShield scanning service: FastAPI health API and PostgreSQL-backed scan worker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "dnspython>=2.6.0",
  "defusedxml>=0.7.1",
  "pydantic-settings>=2.4.0",
  "psycopg[binary,pool]>=3.2.0",
  "pyjwt[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neoshield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
